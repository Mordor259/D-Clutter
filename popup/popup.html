<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>D-Clutter Settings</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>D-Clutter</h1>
      <label class="row">
        <span>Enable clutter free mode</span>
        <input id="enabled" type="checkbox" />
      </label>

      <label class="stack">
        <span>Theme</span>
        <select id="theme">
          <option value="auto">Auto</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>

      <p class="hint">Reload the current tab after changing settings.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
